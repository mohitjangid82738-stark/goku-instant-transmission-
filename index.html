
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOKU | Instant Transmission</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020713;color:#dffaff;
 font-family:Arial,sans-serif;overflow:hidden;
}
#app{height:100dvh;width:100%;position:relative;background:
 radial-gradient(ellipse at center,#08294a,#020713 75%)}
canvas{
 position:absolute;width:100%;height:100%;
 inset:0;object-fit:contain;
}
video{display:none}
.hud{
 position:absolute;z-index:5;top:15px;left:0;width:100%;
 text-align:center;pointer-events:none;
}
h1{font-size:21px;letter-spacing:4px;color:#65eaff;
 text-shadow:0 0 15px #00bfff;margin:5px}
#status{font-size:11px;letter-spacing:2px;color:#9aeaff}
.panel{
 position:absolute;z-index:6;bottom:20px;left:12px;right:12px;
 background:#031a2cdd;border:1px solid #00bfff77;
 border-radius:15px;padding:14px;text-align:center;
 box-shadow:0 0 20px #007bff33;
}
button{
 background:#062d4c;color:#b9f6ff;border:1px solid #00cfff;
 padding:12px 18px;border-radius:9px;font-weight:bold;
 margin:4px;letter-spacing:1px;
}
button:active{background:#087cb1}
.small{font-size:10px;color:#8acbdf;margin-top:8px}
#start{background:#006da5}
#flash{
 position:absolute;inset:0;z-index:4;pointer-events:none;
 background:#8beeff;opacity:0;
}
</style>
</head>

<body>
<div id="app">
 <video id="video" autoplay playsinline muted></video>
 <canvas id="screen"></canvas>
 <div id="flash"></div>

 <div class="hud">
  <h1>GOKU // INSTANT TRANSMISSION</h1>
  <div id="status">SYSTEM STANDBY</div>
 </div>

 <div class="panel">
  <button id="start">ACTIVATE CAMERA</button>
  <button id="manual">TELEPORT</button>
  <button id="stop">STOP</button>
  <div class="small">
   Hold two fingers near your forehead to activate transmission.
  </div>
  <div class="small" id="gesture">GESTURE SCANNER: WAITING</div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const gestureText=document.getElementById("gesture");
const flash=document.getElementById("flash");

let stream=null, running=false;
let segmentation=null,hands=null,face=null;
let mask=null,foreground=null;
let handData=null,faceData=null;
let teleported=false;
let gestureStart=0,lastTrigger=0;
let particles=[];
let energy=0;
let frameBusy=false;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
}
addEventListener("resize",resize);
resize();

function setStatus(s){
 statusText.textContent=s;
}

function makeParticleBurst(){
 particles=[];
 if(!foreground)return;
 const w=foreground.width,h=foreground.height;
 const c=foreground.getContext("2d");
 const data=c.getImageData(0,0,w,h).data;

 for(let y=0;y<h;y+=8){
  for(let x=0;x<w;x+=8){
   const i=(y*w+x)*4;
   if(data[i+3]>120 && Math.random()<.7){
    const a=Math.random()*Math.PI*2;
    const speed=1+Math.random()*7;
    particles.push({
     x:x/w*canvas.width,
     y:y/h*canvas.height,
     vx:Math.cos(a)*speed,
     vy:Math.sin(a)*speed,
     life:40+Math.random()*50,
     size:1+Math.random()*3
    });
   }
  }
 }
}

function teleport(){
 if(!running)return;
 if(!teleported){
  makeParticleBurst();
  teleported=true;
  setStatus("INSTANT TRANSMISSION // DISAPPEARING");
  flash.style.opacity=".25";
  setTimeout(()=>flash.style.opacity="0",100);
 }else{
  teleported=false;
  setStatus("RE-MATERIALIZING // ONLINE");
  flash.style.opacity=".45";
  setTimeout(()=>flash.style.opacity="0",120);
 }
}

document.getElementById("manual").onclick=teleport;

function fingerUp(lm,tip,pip){
 return lm[tip].y < lm[pip].y;
}

function checkGesture(){
 if(!handData || !faceData || !faceData.multiFaceLandmarks?.length){
  gestureStart=0;
  gestureText.textContent="GESTURE SCANNER: FINDING FACE";
  return;
 }

 const facePoints=faceData.multiFaceLandmarks[0];
 const forehead=facePoints[10];

 let detected=false;

 for(const lm of handData.multiHandLandmarks||[]){
  const index=fingerUp(lm,8,6);
  const middle=fingerUp(lm,12,10);
  const ring=!fingerUp(lm,16,14);
  const pinky=!fingerUp(lm,20,18);

  const mx=(lm[8].x+lm[12].x)/2;
  const my=(lm[8].y+lm[12].y)/2;

  const distance=Math.hypot(mx-forehead.x,my-forehead.y);

  if(index&&middle&&ring&&pinky&&distance<.17){
   detected=true;
   break;
  }
 }

 if(detected){
  gestureText.textContent="TWO-FINGER GESTURE DETECTED";
  if(!gestureStart)gestureStart=Date.now();

  if(Date.now()-gestureStart>750 &&
     Date.now()-lastTrigger>2200){
   lastTrigger=Date.now();
   gestureStart=0;
   teleport();
  }
 }else{
  gestureStart=0;
  gestureText.textContent="GESTURE SCANNER: SEARCHING";
 }
}

function drawParticles(){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx;
  p.y+=p.vy;
  p.vx*=.98;
  p.vy*=.98;
  p.life--;

  ctx.fillStyle=`rgba(45,210,255,${Math.max(0,p.life/80)})`;
  ctx.shadowBlur=15;
  ctx.shadowColor="#00cfff";
  ctx.fillRect(p.x,p.y,p.size,p.size);

  if(p.life<=0)particles.splice(i,1);
 }
 ctx.shadowBlur=0;
}

function drawLightning(){
 if(!foreground)return;
 const w=canvas.width,h=canvas.height;
 const step=30;

 ctx.save();
 ctx.globalCompositeOperation="screen";
 ctx.strokeStyle="#4ceaff";
 ctx.shadowColor="#00aaff";
 ctx.shadowBlur=18;
 ctx.lineWidth=2;

 for(let n=0;n<5;n++){
  let x=Math.random()*w;
  let y=Math.random()*h*.85;
  ctx.beginPath();
  ctx.moveTo(x,y);

  for(let j=0;j<7;j++){
   x+=(Math.random()-.5)*step*2;
   y+=step*(Math.random()+.3);
   ctx.lineTo(x,y);
  }
  ctx.stroke();
 }
 ctx.restore();
}

function render(){
 if(!running)return;

 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);

 // Dark cinematic background
 ctx.fillStyle="#020713";
 ctx.fillRect(0,0,w,h);

 // Dim live camera background
 ctx.save();
 ctx.globalAlpha=.18;
 ctx.filter="brightness(.5) saturate(.4)";
 ctx.drawImage(video,0,0,w,h);
 ctx.restore();

 if(foreground && !teleported){
  // Glowing body layer
  ctx.save();
  ctx.globalCompositeOperation="screen";
  ctx.shadowColor="#00bfff";
  ctx.shadowBlur=28;
  ctx.drawImage(foreground,0,0,w,h);
  ctx.restore();

  // Strong blue hologram overlay
  ctx.save();
  ctx.globalCompositeOperation="screen";
  ctx.globalAlpha=.20;
  ctx.filter="saturate(2) brightness(1.5)";
  ctx.drawImage(foreground,0,0,w,h);
  ctx.restore();

  // Energy lightning
  if(energy>0)drawLightning();
 }

 drawParticles();

 energy=Math.min(1,energy+.025);

 if(teleported && particles.length===0){
  setStatus("TRANSMISSION COMPLETE // INVISIBLE");
 }

 requestAnimationFrame(render);
}

async function startCamera(){
 if(running)return;
 try{
  setStatus("INITIALIZING CAMERA...");
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{facingMode:"user",width:640,height:480}
  });
  video.srcObject=stream;
  await video.play();

  segmentation=new SelfieSegmentation({
   locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
  });
  segmentation.setOptions({modelSelection:1});
  segmentation.onResults(results=>{
   if(!mask){
    mask=document.createElement("canvas");
    foreground=document.createElement("canvas");
   }
   const w=results.image.width,h=results.image.height;
   mask.width=foreground.width=w;
   mask.height=foreground.height=h;

   const mc=mask.getContext("2d");
   mc.clearRect(0,0,w,h);
   mc.drawImage(results.segmentationMask,0,0,w,h);

   const fc=foreground.getContext("2d");
   fc.clearRect(0,0,w,h);
   fc.drawImage(results.image,0,0,w,h);
   fc.globalCompositeOperation="destination-in";
   fc.drawImage(mask,0,0,w,h);
   fc.globalCompositeOperation="source-over";
  });

  hands=new Hands({
   locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
   maxNumHands:2,
   modelComplexity:0,
   minDetectionConfidence:.65,
   minTrackingConfidence:.6
  });
  hands.onResults(r=>handData=r);

  face=new FaceMesh({
   locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });
  face.setOptions({
   maxNumFaces:1,
   refineLandmarks:false,
   minDetectionConfidence:.6,
   minTrackingConfidence:.6
  });
  face.onResults(r=>faceData=r);

  await Promise.all([
   segmentation.initialize(),
   hands.initialize(),
   face.initialize()
  ]);

  running=true;
  setStatus("J.A.R.V.I.S. SYSTEM ONLINE");
  render();
  processFrames();

 }catch(e){
  console.error(e);
  setStatus("CAMERA ERROR: "+e.message);
  alert("Camera start nahi hua. Chrome ko camera permission do aur HTTPS par page kholo.");
 }
}

async function processFrames(){
 while(running){
  if(!frameBusy && video.readyState>=2){
   frameBusy=true;
   try{
    await segmentation.send({image:video});
    await hands.send({image:video});
    await face.send({image:video});
    checkGesture();
   }catch(e){
    console.error(e);
   }
   frameBusy=false;
  }
  await new Promise(r=>setTimeout(r,45));
 }
}

function stopCamera(){
 running=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 video.srcObject=null;
 teleported=false;
 particles=[];
 setStatus("SYSTEM STANDBY");
 gestureText.textContent="GESTURE SCANNER: OFF";
 ctx.clearRect(0,0,canvas.width,canvas.height);
}

document.getElementById("start").onclick=startCamera;
document.getElementById("stop").onclick=stopCamera;
</script>
</body>
</html>
